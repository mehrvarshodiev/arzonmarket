    <title>ArzonMarket — смартфоны и аксессуары по доступным ценам</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "ArzonMarket",
        "url": "https://arzonmarket-omega.vercel.app/",
        "description": "Смартфоны, гаджеты и аксессуары по доступным ценам.",
        "telephone": "+79262770808",
        "sameAs": [
          "https://instagram.com/arzon_market_ru",
          "https://t.me/ARZON_MARKET_RU"
        ]
      }
    </script>
    <script>
      (function () {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.style.colorScheme = 'light';
        try { localStorage.setItem('am_theme', 'light'); } catch (_) {}
      })();
    </script>
    <script>
      (function () {
        var timer = window.setTimeout(showStartupError, 12000);
        function showStartupError(reason) {
          var root = document.getElementById('root');
          if (!root || !root.querySelector('.boot-loader')) { window.clearTimeout(timer); return; }
          window.clearTimeout(timer);
          root.innerHTML = '<main class="boot-loader" role="alert" style="padding:24px;text-align:center"><div class="boot-brand"><span class="boot-icon">!</span><span>arzon<span class="boot-accent">market</span></span></div><p class="boot-message" style="max-width:320px;line-height:1.7">Не удалось запустить магазин. Проверьте подключение к интернету и попробуйте обновить страницу.</p><button id="boot-retry" type="button" style="border:0;border-radius:12px;padding:12px 18px;background:#b7f36b;color:#10140b;font-weight:800">Перезагрузить</button><span class="boot-caption">Технологии ближе</span></main>';
          var retry = document.getElementById('boot-retry');
          if (retry) retry.addEventListener('click', function () { window.location.reload(); });
          if (reason) console.error('ArzonMarket startup failed:', reason);
        }
        window.addEventListener('error', function (event) {
          if (event.target && event.target.tagName === 'SCRIPT') showStartupError(event.message || 'Script failed to load');
          else if (event.message) showStartupError(event.message);
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          showStartupError(event.reason && (event.reason.message || String(event.reason)));
        });
      })();
    </script>
    <style>
      :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#f5f7fa;color:#182230}
      :root[data-theme="light"]{color-scheme:light;background:#f5f7fa;color:#182230}
      *{box-sizing:border-box}body{margin:0;min-width:320px;background:#f5f7fa;color:#182230}
      :root[data-theme="light"] body{background:#f5f7fa;color:#182230}
      .boot-loader{min-height:100svh;display:grid;place-content:center;justify-items:center;gap:20px;background:radial-gradient(ellipse at 50% 45%,rgba(117,164,47,.08),transparent 40%),#f5f7fa}
      .boot-brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;letter-spacing:-.04em;color:#182230}
      .boot-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#b7f36b;color:#10140b}
      .boot-accent{color:#5a8c23}.boot-ring{width:38px;height:38px;border:2px solid #dce8cc;border-top-color:#5a8c23;border-radius:50%;animation:boot-spin .8s linear infinite}
      .boot-message{margin:0;color:#586477;font-size:13px}.boot-caption{color:#7a8597;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
            @keyframes boot-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.boot-ring{animation:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-loader" role="status" aria-live="polite">
        <div class="boot-brand"><span class="boot-icon">▣</span><span>arzon<span class="boot-accent">market</span></span></div>
        <span class="boot-ring" aria-hidden="true"></span>
        <p class="boot-message">Готовим магазин…</p>
        <span class="boot-caption">Технологии ближе</span>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
