<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a0f" />
    <meta name="description" content="ArzonMarket — смартфоны и аксессуары по выгодным ценам." />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <title>ArzonMarket — техника ближе</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('am_theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
    <style>
      :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#080a0f;color:#f8fafc}
      :root[data-theme="light"]{color-scheme:light;background:#f5f7fa;color:#182230}
      *{box-sizing:border-box}body{margin:0;min-width:320px;background:#080a0f}
      :root[data-theme="light"] body{background:#f5f7fa;color:#182230}
      .boot-loader{min-height:100svh;display:grid;place-content:center;justify-items:center;gap:20px;background:radial-gradient(ellipse at 50% 45%,rgba(183,243,107,.09),transparent 40%),#080a0f}
      .boot-brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;letter-spacing:-.04em}
      .boot-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#b7f36b;color:#10140b}
      .boot-accent{color:#b7f36b}.boot-ring{width:38px;height:38px;border:2px solid #293321;border-top-color:#b7f36b;border-radius:50%;animation:boot-spin .8s linear infinite}
      .boot-message{margin:0;color:#a5adbc;font-size:13px}.boot-caption{color:#697386;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
      :root[data-theme="light"] .boot-loader{background:radial-gradient(ellipse at 50% 45%,rgba(117,164,47,.08),transparent 40%),#f5f7fa}
      :root[data-theme="light"] .boot-brand{color:#182230}
      :root[data-theme="light"] .boot-message{color:#586477}
      @keyframes boot-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.boot-ring{animation:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-loader" role="status" aria-live="polite">
        <div class="boot-brand"><span class="boot-icon">▣</span><span>arzon<span class="boot-accent">market</span></span></div>
        <span class="boot-ring" aria-hidden="true"></span>
        <p class="boot-message">Готовим магазин…</p>
        <span class="boot-caption">Технологии ближе</span>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
